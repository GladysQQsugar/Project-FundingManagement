# Windows Nginx 内网部署模板
#
# 使用方法：
# 1. 安装 Nginx for Windows
# 2. 把本文件复制到 nginx/conf/conf.d/funding-management.conf
# 3. 确认 nginx.conf 里包含：include conf.d/*.conf;
# 4. 后端 .env 推荐设置：HOST=127.0.0.1, PORT=3001
# 5. Windows 防火墙只开放 80 端口，3001 和 3306 不对局域网开放

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # 前端静态文件目录。请按服务器实际路径修改。
    root C:/apps/Project-FundingManagement/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
